[tool.coverage.run]
branch = true
source = [ "byor_scanner" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/scanner/html'
 --cov-report xml:'../../coverage/packages/scanner/coverage.xml'
 --html='../../reports/packages/scanner/unittests/html/index.html'
 --junitxml='../../reports/packages/scanner/unittests/junit.xml'
"""

[project]
name = "scanner"
version = "1.0.0"
description = "Inspector BYOR Scanner Lambda handlers"
requires-python = ">=3.11,<4"
readme = 'README.md'
dependencies = [
    "aws-lambda-powertools>=3.29.0",
    "boto3>=1.43.25",
    # Pinned to match the AWS Distro for OpenTelemetry (ADOT) Lambda layer.
    # Mismatched versions trigger a runtime warning. Bump together when
    # rotating the ADOT layer ARN in scanner-stack.ts.
    "opentelemetry-api==1.40.0",
]

[tool.hatch.build.targets.wheel]
packages = ["byor_scanner"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
