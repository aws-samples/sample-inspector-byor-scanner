name: "📚 Documentation Issue"
description: Report missing, unclear, or incorrect documentation
title: "(short description)"
labels: [documentation, needs-triage]
body:
  - type: textarea
    id: description
    attributes:
      label: What is the issue?
      description: |
        Which page, file, or section is incorrect or missing? A link or file path helps.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: false
